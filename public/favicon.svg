<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Red Portfolio Binder Body -->
  <rect x="12" y="6" width="46" height="52" rx="6" fill="#881337" stroke="#9f1239" stroke-width="2" />
  
  <!-- Spine Shadow / Crease -->
  <line x1="23" y1="6" x2="23" y2="58" stroke="#4c0519" stroke-width="2.5" />
  
  <!-- Interior Document Page Insert -->
  <rect x="28" y="12" width="24" height="40" rx="3" fill="#fbfaf7" />
  <line x1="33" y1="20" x2="47" y2="20" stroke="#881337" stroke-width="2.5" stroke-linecap="round" />
  <line x1="33" y1="28" x2="47" y2="28" stroke="#881337" stroke-width="2.5" stroke-linecap="round" />
  <line x1="33" y1="36" x2="42" y2="36" stroke="#881337" stroke-width="2.5" stroke-linecap="round" />

  <!-- Gold Bookmark Ribbon -->
  <polygon points="42,6 47,6 47,15 44.5,13 42,15" fill="#d97706" />

  <!-- 3 Metallic Binder Rings Along the Spine -->
  <rect x="6" y="15" width="16" height="5" rx="2.5" fill="#fde68a" stroke="#d97706" stroke-width="1" />
  <rect x="6" y="29.5" width="16" height="5" rx="2.5" fill="#fde68a" stroke="#d97706" stroke-width="1" />
  <rect x="6" y="44" width="16" height="5" rx="2.5" fill="#fde68a" stroke="#d97706" stroke-width="1" />
</svg>
