<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="trojanSunset" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="55%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#1c0702"/>
    </radialGradient>
    <linearGradient id="bronzeShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#trojanSunset)"/>
  <rect x="16" y="16" width="568" height="368" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.6"/>
  <rect x="24" y="24" width="552" height="352" fill="none" stroke="#fed7aa" stroke-width="0.75" opacity="0.25"/>

  <!-- High Walls & Gates of Troy in Distance -->
  <g fill="#2e1005" stroke="#78350f" stroke-width="1.5">
    <polygon points="60,260 60,180 90,180 90,195 110,195 110,180 140,180 140,195 160,195 160,180 190,180 190,260"/>
    <polygon points="410,260 410,180 440,180 440,195 460,195 460,180 490,180 490,195 510,195 510,180 540,180 540,260"/>
  </g>

  <!-- The Great Shield of Achilles (Forged by Hephaestus) -->
  <g transform="translate(300, 165)">
    <!-- Outer Bronze Rim with Ocean Stream pattern -->
    <circle cx="0" cy="0" r="82" fill="url(#bronzeShield)" stroke="#451a03" stroke-width="3"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="6,3"/>
    <!-- Middle Band: The Heavens, Sun, Moon & Stars -->
    <circle cx="0" cy="0" r="54" fill="#1c1917" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="14" fill="#fbbf24"/>
    <g fill="#fef08a">
      <circle cx="-30" cy="-20" r="2.5"/><circle cx="28" cy="-22" r="2.5"/>
      <circle cx="-25" cy="24" r="2"/><circle cx="26" cy="22" r="2"/>
      <circle cx="0" cy="-35" r="2"/><circle cx="0" cy="35" r="2"/>
    </g>
    <!-- Central Boss of the Shield -->
    <circle cx="0" cy="0" r="8" fill="#fef08a" stroke="#78350f" stroke-width="2"/>
  </g>

  <!-- Crested Corinthian Helmet of Hector / Achilles -->
  <g transform="translate(420, 160) scale(0.9)">
    <!-- Bronze Helmet Dome -->
    <path d="M 0 0 C 15 -35, 60 -35, 75 0 C 75 25, 65 50, 45 60 L 30 60 C 10 50, 0 25, 0 0 Z" fill="#d97706" stroke="#78350f" stroke-width="2"/>
    <!-- Eye slits & Nose guard -->
    <path d="M 20 25 L 35 38 L 50 25" stroke="#1c0702" stroke-width="3" fill="none"/>
    <line x1="35" y1="20" x2="35" y2="48" stroke="#1c0702" stroke-width="3"/>
    <!-- Horsehair Crest (Lophos) -->
    <path d="M 10 -25 Q 40 -60, 80 -45 Q 90 -20, 80 5" stroke="#b91c1c" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 12 -23 Q 40 -55, 78 -42" stroke="#fca5a5" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Crossed Bronze Spears (Ash Spear of Pelion) -->
  <g stroke="#d97706" stroke-width="2.5" opacity="0.85">
    <line x1="100" y1="280" x2="220" y2="80"/>
    <polygon points="220,80 216,92 227,88" fill="#fef08a"/>
  </g>

  <!-- Dusty Plains of Troy Horizon -->
  <path d="M 0 300 Q 300 275, 600 300 L 600 400 L 0 400 Z" fill="#1c0702" stroke="#d97706" stroke-width="1"/>

  <!-- Classical Plaque Caption -->
  <g transform="translate(300, 370)" text-anchor="middle">
    <rect x="-80" y="-16" width="160" height="24" rx="3" fill="#1c0702" stroke="#d97706" stroke-width="1"/>
    <text y="1" font-family="'Libre Baskerville', Georgia, serif" font-size="12" fill="#fef08a" letter-spacing="1.5">THE ILIAD</text>
  </g>
</svg>
