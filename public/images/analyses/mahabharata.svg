<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="kurukshetraSky" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#581c1c"/>
      <stop offset="60%" stop-color="#2a0b0b"/>
      <stop offset="100%" stop-color="#110404"/>
    </radialGradient>
    <linearGradient id="goldChakra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#kurukshetraSky)"/>
  <rect x="16" y="16" width="568" height="368" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.6"/>
  <rect x="24" y="24" width="552" height="352" fill="none" stroke="#fca5a5" stroke-width="0.75" opacity="0.25"/>

  <!-- Battlefield Haze & Rising Sun -->
  <circle cx="300" cy="170" r="110" fill="#f59e0b" opacity="0.08"/>
  <circle cx="300" cy="170" r="75" fill="#f59e0b" opacity="0.15"/>

  <!-- The Great Chariot Wheel (Dharma Chakra of Kurukshetra) -->
  <g transform="translate(300, 175)">
    <!-- Outer Rim -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="url(#goldChakra)" stroke-width="5"/>
    <circle cx="0" cy="0" r="64" fill="none" stroke="#fef08a" stroke-width="1.5"/>
    <!-- Hub -->
    <circle cx="0" cy="0" r="16" fill="#78350f" stroke="#fef08a" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6" fill="#fef08a"/>

    <!-- 16 Spokes of Moral Duty & Time -->
    <!-- Cardinal & Diagonal spokes -->
    <g stroke="url(#goldChakra)" stroke-width="2.5">
      <line x1="0" y1="-64" x2="0" y2="-16"/><line x1="0" y1="16" x2="0" y2="64"/>
      <line x1="-64" y1="0" x2="-16" y2="0"/><line x1="16" y1="0" x2="64" y2="0"/>
      <line x1="-45" y1="-45" x2="-11" y2="-11"/><line x1="11" y1="11" x2="45" y2="45"/>
      <line x1="45" y1="-45" x2="11" y2="-11"/><line x1="-11" y1="11" x2="-45" y2="45"/>
    </g>
    <!-- Alternate spokes -->
    <g stroke="#fde047" stroke-width="1.5" opacity="0.8">
      <line x1="-24" y1="-59" x2="-6" y2="-15"/><line x1="6" y1="15" x2="24" y2="59"/>
      <line x1="24" y1="-59" x2="6" y2="-15"/><line x1="-6" y1="15" x2="-24" y2="59"/>
      <line x1="-59" y1="-24" x2="-15" y2="-6"/><line x1="15" y1="6" x2="59" y2="24"/>
      <line x1="59" y1="-24" x2="15" y2="-6"/><line x1="-15" y1="6" x2="-59" y2="24"/>
    </g>
  </g>

  <!-- Left: Chariot Banner of Arjuna (Kapidhwaja / Flag of Hanuman) -->
  <g transform="translate(130, 80)">
    <line x1="0" y1="0" x2="0" y2="220" stroke="#d97706" stroke-width="3"/>
    <!-- Triangular war flag -->
    <polygon points="0,15 90,45 0,75" fill="#b91c1c" stroke="#fef08a" stroke-width="1.5"/>
    <circle cx="35" cy="45" r="10" fill="#fef08a" opacity="0.7"/>
    <!-- Spearhead tip -->
    <polygon points="0,-10 -6,0 6,0" fill="#fef08a"/>
  </g>

  <!-- Right: The Sacred Conch Shell (Panchajanya of Krishna) -->
  <g transform="translate(460, 160) scale(0.9) rotate(20)">
    <!-- Conch Body -->
    <path d="M 0 -40 C 25 -30, 45 0, 30 35 C 15 60, -10 65, -20 40 C -30 20, -25 -20, 0 -40 Z" fill="#fefae0" stroke="#d97706" stroke-width="2"/>
    <!-- Spirals -->
    <path d="M 5 -35 C 18 -15, 12 15, -5 25 C -15 30, -20 15, -12 -5" fill="none" stroke="#b45309" stroke-width="2"/>
    <path d="M -15 45 L -25 70 L -15 65 Z" fill="#fefae0" stroke="#d97706" stroke-width="1.5"/>
    <!-- Sound Waves of Truth -->
    <path d="M 35 15 A 25 25 0 0 1 50 45" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M 45 5 A 40 40 0 0 1 65 50" fill="none" stroke="#fde047" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Battlefield Plain of Kurukshetra -->
  <path d="M 0 310 Q 300 285, 600 310 L 600 400 L 0 400 Z" fill="#110404" stroke="#d97706" stroke-width="1"/>

  <!-- Classical Plaque Caption -->
  <g transform="translate(300, 370)" text-anchor="middle">
    <rect x="-115" y="-16" width="230" height="24" rx="3" fill="#110404" stroke="#d97706" stroke-width="1"/>
    <text y="1" font-family="'Libre Baskerville', Georgia, serif" font-size="12" fill="#fef08a" letter-spacing="1.5">THE MAHABHARATA</text>
  </g>
</svg>
