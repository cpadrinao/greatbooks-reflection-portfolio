<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="aegeanNight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="bronzeOar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#aegeanNight)"/>
  <rect x="16" y="16" width="568" height="368" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.6"/>
  <rect x="24" y="24" width="552" height="352" fill="none" stroke="#93c5fd" stroke-width="0.75" opacity="0.25"/>

  <!-- Navigational Constellation (The Pleiades & Orion) -->
  <g fill="#fef08a" opacity="0.8">
    <circle cx="100" cy="70" r="2"/><circle cx="120" cy="65" r="1.5"/><circle cx="135" cy="80" r="1.5"/>
    <circle cx="145" cy="70" r="2"/><circle cx="160" cy="85" r="1.5"/><circle cx="175" cy="75" r="1.5"/>
    <!-- Crescent Moon -->
    <path d="M 490 60 A 24 24 0 0 0 514 84 A 20 20 0 0 1 490 60 Z" fill="#fef08a" opacity="0.9"/>
  </g>

  <!-- Greek Galley (Odysseus' Ship of Nostos) -->
  <g transform="translate(140, 90)">
    <!-- Main Mast & Yard -->
    <line x1="160" y1="20" x2="160" y2="160" stroke="#78350f" stroke-width="4.5"/>
    <line x1="85" y1="35" x2="235" y2="35" stroke="#78350f" stroke-width="3"/>

    <!-- Square Billowing Sail with Greek Meander Border -->
    <path d="M 90 35 Q 160 55, 230 35 L 220 125 Q 160 145, 100 125 Z" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <!-- Rigging Ropes -->
    <line x1="160" y1="25" x2="40" y2="150" stroke="#d97706" stroke-width="1" opacity="0.6"/>
    <line x1="160" y1="25" x2="280" y2="150" stroke="#d97706" stroke-width="1" opacity="0.6"/>

    <!-- Ship Hull (Curved Stern & Pointed Ram) -->
    <path d="M 30 140 Q 150 175, 280 145 L 295 130 Q 310 135, 320 155 L 285 165 Q 150 185, 20 150 Q 15 130, 25 115" fill="#451a03" stroke="#291002" stroke-width="2"/>
    <!-- Bronze Ram at the Bow -->
    <polygon points="305,150 328,156 302,162" fill="#d97706"/>
    <!-- High Curved Swan/Aphlaston Stern -->
    <path d="M 25 115 Q 15 80, 5 75 Q 10 95, 20 130" stroke="#d97706" stroke-width="2.5" fill="none"/>
    <!-- Apotropaic Eye of the Ship -->
    <ellipse cx="270" cy="150" rx="6" ry="4" fill="#ffffff"/>
    <circle cx="270" cy="150" r="2.5" fill="#0f172a"/>

    <!-- Bank of Sweeping Oars -->
    <g stroke="url(#bronzeOar)" stroke-width="2" stroke-linecap="round">
      <line x1="60" y1="160" x2="35" y2="195"/>
      <line x1="90" y1="162" x2="65" y2="197"/>
      <line x1="120" y1="164" x2="95" y2="199"/>
      <line x1="150" y1="165" x2="125" y2="200"/>
      <line x1="180" y1="164" x2="155" y2="199"/>
      <line x1="210" y1="162" x2="185" y2="197"/>
      <line x1="240" y1="160" x2="215" y2="195"/>
    </g>
  </g>

  <!-- Rolling Waves of Poseidon's Aegean Sea -->
  <g fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.2">
    <!-- Wave crests in Greek meander rhythm -->
    <path d="M 0 290 Q 50 265, 100 290 T 200 290 T 300 290 T 400 290 T 500 290 T 600 290 L 600 400 L 0 400 Z" fill="#032541"/>
    <path d="M 0 315 Q 60 295, 120 315 T 240 315 T 360 315 T 480 315 T 600 315 L 600 400 L 0 400 Z" fill="#02182b"/>
  </g>

  <!-- Olive Branch of Athena / Symbol of Ithaca -->
  <g transform="translate(80, 240) rotate(-20) scale(0.8)">
    <path d="M 0 0 Q 30 -10, 60 0" stroke="#84cc16" stroke-width="2" fill="none"/>
    <ellipse cx="15" cy="-8" rx="8" ry="3" fill="#65a30d" transform="rotate(-30 15 -8)"/>
    <ellipse cx="35" cy="-10" rx="8" ry="3" fill="#65a30d" transform="rotate(20 35 -10)"/>
    <ellipse cx="50" cy="-6" rx="8" ry="3" fill="#65a30d" transform="rotate(-15 50 -6)"/>
  </g>

  <!-- Classical Plaque Caption -->
  <g transform="translate(300, 370)" text-anchor="middle">
    <rect x="-85" y="-16" width="170" height="24" rx="3" fill="#02182b" stroke="#d97706" stroke-width="1"/>
    <text y="1" font-family="'Libre Baskerville', Georgia, serif" font-size="12" fill="#fef08a" letter-spacing="1.5">THE ODYSSEY</text>
  </g>
</svg>
