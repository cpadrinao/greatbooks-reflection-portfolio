<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="saffronGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="55%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0a00"/>
    </radialGradient>
    <linearGradient id="goldBow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#saffronGlow)"/>
  <rect x="16" y="16" width="568" height="368" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.6"/>
  <rect x="24" y="24" width="552" height="352" fill="none" stroke="#fed7aa" stroke-width="0.75" opacity="0.25"/>

  <!-- Solar Halo of the Solar Dynasty (Suryavansha) -->
  <g transform="translate(300, 140)">
    <circle cx="0" cy="0" r="64" fill="#fbbf24" opacity="0.15"/>
    <circle cx="0" cy="0" r="48" fill="#f59e0b" opacity="0.25"/>
    <!-- Sun rays -->
    <g stroke="#fde047" stroke-width="1.5" opacity="0.5">
      <line x1="0" y1="-75" x2="0" y2="-60"/><line x1="0" y1="60" x2="0" y2="75"/>
      <line x1="-75" y1="0" x2="-60" y2="0"/><line x1="60" y1="0" x2="75" y2="0"/>
      <line x1="-53" y1="-53" x2="-42" y2="-42"/><line x1="42" y1="42" x2="53" y2="53"/>
      <line x1="53" y1="-53" x2="42" y2="-42"/><line x1="-42" y1="42" x2="-53" y2="53"/>
    </g>
  </g>

  <!-- Divine Bow Kodanda of Rama -->
  <g transform="translate(260, 20) rotate(-15)">
    <!-- Arch of the Bow -->
    <path d="M 0 40 Q 60 160, 0 280" fill="none" stroke="url(#goldBow)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Carved Grip & Horns -->
    <circle cx="28" cy="160" r="6" fill="#fef08a"/>
    <path d="M 0 40 L 4 30 L -2 24" fill="none" stroke="#fef08a" stroke-width="2"/>
    <path d="M 0 280 L 4 290 L -2 296" fill="none" stroke="#fef08a" stroke-width="2"/>
    <!-- Bowstring -->
    <line x1="0" y1="40" x2="0" y2="280" stroke="#fef08a" stroke-width="1" stroke-dasharray="2,1" opacity="0.8"/>
    <!-- Feathered Golden Arrow of Dharma -->
    <line x1="-30" y1="160" x2="110" y2="160" stroke="#fef08a" stroke-width="2"/>
    <!-- Arrowhead -->
    <polygon points="110,156 126,160 110,164" fill="#fde047"/>
    <!-- Fletching -->
    <path d="M -30 160 L -45 152 M -30 160 L -45 168 M -20 160 L -35 152 M -20 160 L -35 168" stroke="#fef08a" stroke-width="1.5"/>
  </g>

  <!-- The Golden Deer (Maricha) Silhouette in Dandaka Forest -->
  <g transform="translate(420, 250) scale(0.85)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="#fbbf24"/>
    <!-- Neck & Head -->
    <path d="M 16 -5 Q 26 -22, 28 -32" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" fill="none"/>
    <ellipse cx="30" cy="-35" rx="8" ry="6" fill="#fef08a"/>
    <!-- Antlers with golden luster -->
    <path d="M 30 -38 Q 28 -55, 20 -60 M 26 -48 Q 16 -50, 14 -54 M 32 -38 Q 38 -55, 46 -58 M 36 -48 Q 44 -50, 48 -54" stroke="#fef08a" stroke-width="1.8" fill="none"/>
    <!-- Legs -->
    <line x1="-12" y1="12" x2="-14" y2="38" stroke="#fbbf24" stroke-width="2.5"/>
    <line x1="-4" y1="12" x2="-2" y2="38" stroke="#fbbf24" stroke-width="2.5"/>
    <line x1="10" y1="12" x2="12" y2="38" stroke="#fbbf24" stroke-width="2.5"/>
    <line x1="18" y1="12" x2="22" y2="38" stroke="#fbbf24" stroke-width="2.5"/>
    <!-- Tail -->
    <path d="M -22 -2 Q -30 -6, -26 4" stroke="#fbbf24" stroke-width="3" fill="none"/>
  </g>

  <!-- Sacred Lotus (Purity & Devotion) -->
  <g transform="translate(140, 280) scale(0.9)">
    <path d="M 0 0 C -20 -15, -30 -35, 0 -50 C 30 -35, 20 -15, 0 0 Z" fill="#fda4af" stroke="#f43f5e" stroke-width="1"/>
    <path d="M 0 0 C -35 -10, -50 -25, -25 -40 C -10 -25, -5 -10, 0 0 Z" fill="#fecdd3" opacity="0.85"/>
    <path d="M 0 0 C 35 -10, 50 -25, 25 -40 C 10 -25, 5 -10, 0 0 Z" fill="#fecdd3" opacity="0.85"/>
  </g>

  <!-- Forest Ground Horizon -->
  <path d="M 0 325 Q 300 300, 600 325 L 600 400 L 0 400 Z" fill="#1c0a00" stroke="#d97706" stroke-width="1"/>

  <!-- Classical Plaque Caption -->
  <g transform="translate(300, 370)" text-anchor="middle">
    <rect x="-100" y="-16" width="200" height="24" rx="3" fill="#1c0a00" stroke="#d97706" stroke-width="1"/>
    <text y="1" font-family="'Libre Baskerville', Georgia, serif" font-size="12" fill="#fef08a" letter-spacing="1.5">THE RAMAYANA</text>
  </g>
</svg>
