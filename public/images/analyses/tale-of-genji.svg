<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="heianDusk" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="60%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0a0514"/>
    </radialGradient>
    <linearGradient id="goldScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#heianDusk)"/>
  <rect x="16" y="16" width="568" height="368" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.6"/>
  <rect x="24" y="24" width="552" height="352" fill="none" stroke="#fbcfe8" stroke-width="0.75" opacity="0.25"/>

  <!-- Heian Golden Clouds (Yamato-e Style) -->
  <g fill="url(#goldScreen)" opacity="0.2">
    <path d="M 40 60 Q 90 40, 140 65 Q 190 50, 240 70 Q 200 110, 150 95 Q 100 115, 40 60 Z"/>
    <path d="M 420 90 Q 480 70, 540 95 Q 560 140, 500 130 Q 450 145, 420 90 Z"/>
    <path d="M 80 250 Q 140 230, 200 255 Q 170 290, 110 280 Q 70 290, 80 250 Z"/>
  </g>

  <!-- Full Autumn Moon of Heian-Kyo -->
  <circle cx="300" cy="110" r="48" fill="#fef3c7" opacity="0.85"/>
  <circle cx="300" cy="110" r="54" fill="none" stroke="#fef08a" stroke-width="1" opacity="0.4"/>

  <!-- Four-Panel Folding Screen (Byobu) -->
  <g transform="translate(180, 100)">
    <!-- Panel 1 -->
    <polygon points="0,40 55,20 55,190 0,210" fill="#fdfbf7" stroke="#b45309" stroke-width="1.5"/>
    <!-- Panel 2 -->
    <polygon points="55,20 120,40 120,210 55,190" fill="#fef9c3" stroke="#b45309" stroke-width="1.5"/>
    <!-- Panel 3 -->
    <polygon points="120,40 185,20 185,190 120,210" fill="#fdfbf7" stroke="#b45309" stroke-width="1.5"/>
    <!-- Panel 4 -->
    <polygon points="185,20 240,40 240,210 185,190" fill="#fef9c3" stroke="#b45309" stroke-width="1.5"/>
    <!-- Lacquer Wooden Frame line -->
    <line x1="0" y1="210" x2="240" y2="210" stroke="#451a03" stroke-width="3"/>
  </g>

  <!-- Open Court Fan (Sensu / Ogi) -->
  <g transform="translate(300, 240) scale(0.95)">
    <!-- Fan Ribs & Arc -->
    <path d="M -80 -40 A 100 100 0 0 1 80 -40 L 0 45 Z" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <path d="M -60 -25 A 75 75 0 0 1 60 -25 L 0 45 Z" fill="#ffe4e6" opacity="0.7"/>
    <!-- Bamboo Ribs radiating to pivot -->
    <line x1="0" y1="45" x2="-80" y2="-40" stroke="#b45309" stroke-width="1.5"/>
    <line x1="0" y1="45" x2="-45" y2="-55" stroke="#b45309" stroke-width="1"/>
    <line x1="0" y1="45" x2="0" y2="-62" stroke="#b45309" stroke-width="1.2"/>
    <line x1="0" y1="45" x2="45" y2="-55" stroke="#b45309" stroke-width="1"/>
    <line x1="0" y1="45" x2="80" y2="-40" stroke="#b45309" stroke-width="1.5"/>
    <!-- Pivot Ring (Kaname) -->
    <circle cx="0" cy="45" r="4" fill="#d97706"/>
    <!-- Red Silk Tassel -->
    <path d="M 0 49 Q -10 65, -5 85" stroke="#be123c" stroke-width="2" fill="none"/>
    <path d="M 0 49 Q 10 65, 5 85" stroke="#be123c" stroke-width="2" fill="none"/>
  </g>

  <!-- Branch of Cherry Blossoms (Sakura / Mono no Aware) -->
  <g transform="translate(100, 60)">
    <path d="M 20 40 Q 90 20, 160 55 T 220 80" stroke="#451a03" stroke-width="3" fill="none"/>
    <!-- Blossoms -->
    <g fill="#fbcfe8" stroke="#f43f5e" stroke-width="1">
      <circle cx="70" cy="30" r="7"/><circle cx="120" cy="35" r="8"/><circle cx="170" cy="65" r="7"/>
      <circle cx="95" cy="45" r="5"/><circle cx="145" cy="50" r="6"/><circle cx="210" cy="78" r="7"/>
    </g>
    <!-- Falling Petals (Impermanence) -->
    <g fill="#fda4af" opacity="0.8">
      <ellipse cx="140" cy="95" rx="4" ry="2" transform="rotate(35 140 95)"/>
      <ellipse cx="190" cy="115" rx="4" ry="2" transform="rotate(-20 190 115)"/>
      <ellipse cx="230" cy="150" rx="3.5" ry="2" transform="rotate(45 230 150)"/>
      <ellipse cx="260" cy="190" rx="4" ry="2" transform="rotate(-30 260 190)"/>
    </g>
  </g>

  <!-- Veranda of the Heian Palace -->
  <path d="M 0 320 L 600 320 L 600 400 L 0 400 Z" fill="#0a0514" stroke="#d97706" stroke-width="1"/>

  <!-- Classical Plaque Caption -->
  <g transform="translate(300, 370)" text-anchor="middle">
    <rect x="-110" y="-16" width="220" height="24" rx="3" fill="#0a0514" stroke="#d97706" stroke-width="1"/>
    <text y="1" font-family="'Libre Baskerville', Georgia, serif" font-size="12" fill="#fef08a" letter-spacing="1.5">THE TALE OF GENJI</text>
  </g>
</svg>
