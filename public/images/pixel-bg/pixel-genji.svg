<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- THE TALE OF GENJI: The Heian-kyo Imperial Palace & Blooming Cherry Trees -->
  <defs>
    <linearGradient id="heianSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="50%" stop-color="#581c87"/>
      <stop offset="85%" stop-color="#86198f"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="400" fill="url(#heianSky)" opacity="0.5"/>

  <!-- Full Autumn Moon of Kyoto -->
  <g fill="#fef3c7" opacity="0.75">
    <circle cx="500" cy="110" r="54"/>
  </g>

  <!-- Distant Mountains of Kyoto (Higashiyama) -->
  <g fill="#3b0764" opacity="0.55">
    <polygon points="0,320 120,220 280,320"/>
    <polygon points="200,320 380,200 560,320"/>
    <polygon points="480,320 640,210 800,320"/>
    <polygon points="720,320 880,230 1000,320"/>
  </g>

  <!-- Traditional Heian Palace Main Pavilion (Shinden-zukuri Architecture) -->
  <!-- Upper Roof Tier with Sweeping Curved Eaves -->
  <g fill="#1f152b" opacity="0.85">
    <!-- Curved Top Shingle Ridge -->
    <polygon points="495,140 320,185 670,185"/>
    <rect x="300" y="180" width="390" height="12"/>
    <rect x="280" y="188" width="430" height="8"/>
    <!-- Roof Flaring Eaves Tips -->
    <rect x="270" y="182" width="16" height="8"/>
    <rect x="704" y="182" width="16" height="8"/>

    <!-- Pavilion Upper Story Lattice -->
    <rect x="360" y="196" width="270" height="50" fill="#fef9c3" opacity="0.8"/>
    <!-- Wooden Columns -->
    <rect x="380" y="196" width="10" height="50" fill="#451a03"/>
    <rect x="440" y="196" width="10" height="50" fill="#451a03"/>
    <rect x="500" y="196" width="10" height="50" fill="#451a03"/>
    <rect x="560" y="196" width="10" height="50" fill="#451a03"/>
    <rect x="620" y="196" width="10" height="50" fill="#451a03"/>

    <!-- Lower Grand Roof Tier -->
    <polygon points="495,235 240,285 750,285"/>
    <rect x="220" y="280" width="550" height="14"/>
    <rect x="200" y="290" width="590" height="10"/>
    <rect x="190" y="282" width="20" height="10"/>
    <rect x="780" y="282" width="20" height="10"/>

    <!-- Ground Floor Veranda (Engawa) & Paper Screen Wall (Shoji) -->
    <rect x="260" y="300" width="470" height="110" fill="#fef9c3" opacity="0.9"/>
    <!-- Red Lacquer Columns & Railing -->
    <g fill="#881337">
      <rect x="280" y="300" width="12" height="110"/>
      <rect x="340" y="300" width="12" height="110"/>
      <rect x="400" y="300" width="12" height="110"/>
      <rect x="460" y="300" width="12" height="110"/>
      <rect x="520" y="300" width="12" height="110"/>
      <rect x="580" y="300" width="12" height="110"/>
      <rect x="640" y="300" width="12" height="110"/>
      <rect x="700" y="300" width="12" height="110"/>
      <!-- Veranda Floor Beam -->
      <rect x="240" y="390" width="510" height="20" fill="#451a03"/>
    </g>
  </g>

  <!-- Blooming Cherry Blossom Trees (Sakura) Framing the Palace -->
  <g fill="#f43f5e" opacity="0.75">
    <!-- Left Sakura Tree -->
    <rect x="110" y="260" width="18" height="180" fill="#451a03"/>
    <circle cx="120" cy="230" r="75" fill="#fbcfe8"/>
    <circle cx="80" cy="260" r="60" fill="#f472b6"/>
    <circle cx="160" cy="250" r="65" fill="#fda4af"/>
    <!-- Left Blossoms -->
    <circle cx="100" cy="210" r="25" fill="#ffffff"/>
    <circle cx="140" cy="220" r="25" fill="#ffffff"/>

    <!-- Right Sakura Tree -->
    <rect x="880" y="260" width="18" height="180" fill="#451a03"/>
    <circle cx="870" cy="230" r="75" fill="#fbcfe8"/>
    <circle cx="830" cy="260" r="65" fill="#fda4af"/>
    <circle cx="920" cy="250" r="60" fill="#f472b6"/>
    <!-- Right Blossoms -->
    <circle cx="860" cy="210" r="25" fill="#ffffff"/>
    <circle cx="890" cy="220" r="25" fill="#ffffff"/>
  </g>

  <!-- Falling Pixel Cherry Blossom Petals -->
  <g fill="#fda4af" opacity="0.85">
    <rect x="190" y="320" width="6" height="6"/><rect x="230" y="360" width="6" height="6"/>
    <rect x="280" y="340" width="6" height="6"/><rect x="720" y="330" width="6" height="6"/>
    <rect x="770" y="370" width="6" height="6"/><rect x="820" y="340" width="6" height="6"/>
  </g>

  <!-- Palace Courtyard Garden Ground -->
  <rect x="0" y="410" width="1000" height="190" fill="#0a0514" opacity="0.85"/>
  <rect x="0" y="440" width="1000" height="160" fill="#020108" opacity="0.9"/>
</svg>