<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- THE ILIAD: The Fortified Castle & Citadel of Troy (Ilium) -->
  <defs>
    <linearGradient id="trojanSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1000" height="400" fill="url(#trojanSky)" opacity="0.6"/>

  <!-- Distant Mountain Ridge Behind Troy (Mount Ida) -->
  <g fill="#291205" opacity="0.45">
    <polygon points="0,320 80,240 160,320"/>
    <polygon points="120,320 240,210 360,320"/>
    <polygon points="300,320 450,190 600,320"/>
    <polygon points="560,320 720,220 880,320"/>
    <polygon points="820,320 920,250 1000,320"/>
  </g>

  <!-- High Castle Ramparts & Stone Citadel of Troy -->
  <!-- Main Castle Wall Horizon -->
  <rect x="0" y="320" width="1000" height="280" fill="#78350f" opacity="0.4"/>
  <rect x="0" y="360" width="1000" height="240" fill="#451a03" opacity="0.5"/>

  <!-- Left Great Watchtower of the Scaean Gate -->
  <g fill="#291002" opacity="0.65">
    <rect x="120" y="150" width="160" height="250"/>
    <!-- Castle Crenellations / Battlements -->
    <rect x="110" y="130" width="180" height="20"/>
    <rect x="110" y="105" width="25" height="25"/>
    <rect x="150" y="105" width="25" height="25"/>
    <rect x="190" y="105" width="25" height="25"/>
    <rect x="230" y="105" width="25" height="25"/>
    <rect x="265" y="105" width="25" height="25"/>
    <!-- Stone Arrow Slits & Castle Windows -->
    <rect x="160" y="170" width="12" height="30" fill="#fef3c7" opacity="0.8"/>
    <rect x="230" y="170" width="12" height="30" fill="#fef3c7" opacity="0.8"/>
    <rect x="195" y="240" width="14" height="40" fill="#fef3c7" opacity="0.8"/>
    <!-- Castle Banner -->
    <rect x="198" y="55" width="4" height="50" fill="#d97706"/>
    <polygon points="202,58 245,72 202,86" fill="#b91c1c"/>
  </g>

  <!-- Center Grand Palace Keep of King Priam -->
  <g fill="#3f1906" opacity="0.7">
    <rect x="380" y="120" width="240" height="280"/>
    <!-- Keep Battlements -->
    <rect x="365" y="100" width="270" height="20"/>
    <rect x="365" y="75" width="30" height="25"/>
    <rect x="415" y="75" width="30" height="25"/>
    <rect x="465" y="75" width="30" height="25"/>
    <rect x="515" y="75" width="30" height="25"/>
    <rect x="565" y="75" width="30" height="25"/>
    <rect x="605" y="75" width="30" height="25"/>
    <!-- Grand Castle Arched Windows -->
    <rect x="430" y="150" width="22" height="45" fill="#fef3c7" opacity="0.85"/>
    <rect x="490" y="150" width="22" height="45" fill="#fef3c7" opacity="0.85"/>
    <rect x="550" y="150" width="22" height="45" fill="#fef3c7" opacity="0.85"/>
    <rect x="460" y="230" width="80" height="120" fill="#1c0702"/>
    <!-- Scaean Gate Arch Portal -->
    <rect x="475" y="250" width="50" height="100" fill="#000000"/>
  </g>

  <!-- Right Fortress Tower of Hector -->
  <g fill="#291002" opacity="0.65">
    <rect x="720" y="160" width="160" height="240"/>
    <rect x="710" y="140" width="180" height="20"/>
    <rect x="710" y="115" width="25" height="25"/>
    <rect x="750" y="115" width="25" height="25"/>
    <rect x="790" y="115" width="25" height="25"/>
    <rect x="830" y="115" width="25" height="25"/>
    <rect x="865" y="115" width="25" height="25"/>
    <rect x="760" y="180" width="12" height="30" fill="#fef3c7" opacity="0.8"/>
    <rect x="830" y="180" width="12" height="30" fill="#fef3c7" opacity="0.8"/>
    <!-- Banner -->
    <rect x="798" y="65" width="4" height="50" fill="#d97706"/>
    <polygon points="802,68 845,82 802,96" fill="#b91c1c"/>
  </g>

  <!-- Connecting Castle Curtain Walls & Battlements -->
  <g fill="#451a03" opacity="0.6">
    <rect x="280" y="220" width="100" height="180"/>
    <rect x="280" y="200" width="100" height="20"/>
    <rect x="290" y="180" width="20" height="20"/>
    <rect x="330" y="180" width="20" height="20"/>

    <rect x="620" y="220" width="100" height="180"/>
    <rect x="620" y="200" width="100" height="20"/>
    <rect x="640" y="180" width="20" height="20"/>
    <rect x="680" y="180" width="20" height="20"/>
  </g>

  <!-- Foreground Trojan Plain with Spears & Battlements Ground -->
  <rect x="0" y="440" width="1000" height="160" fill="#1c0702" opacity="0.65"/>
  <g fill="#d97706" opacity="0.4">
    <!-- Stone brick texture lines on ramparts -->
    <rect x="40" y="470" width="120" height="4"/>
    <rect x="220" y="490" width="150" height="4"/>
    <rect x="450" y="475" width="100" height="4"/>
    <rect x="680" y="495" width="140" height="4"/>
    <rect x="860" y="470" width="90" height="4"/>
  </g>
</svg>